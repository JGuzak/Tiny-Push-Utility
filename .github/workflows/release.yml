      #     done
      #     echo "Final artifacts:"
      #     ls -la
      - name: List repo bits
        run: ls ${GITHUB_WORKSPACE}
      - name: Copy User Manual
        run: cp ${GITHUB_WORKSPACE}/User-Manual.pdf artifacts/User-Manual.pdf
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.pdf
