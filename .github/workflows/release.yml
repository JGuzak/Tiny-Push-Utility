name: App Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # I do not have a macOS developer certificate, so I cannot build the macOS app. When I decide to pay $99 a year for one, I will uncomment this job.
  # build-macos:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Build app
  #       env:
  #         CSC_LINK: ${{ secrets.CSC_LINK }}
  #         CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
  #         APPLE_ID: ${{ secrets.APPLE_ID }}
  #         APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  #         APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  #       run: npx electron-builder --mac --publish never

  #     - name: Upload artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: app-mac
  #         path: release/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx electron-builder --linux --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: release/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx electron-builder --win --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-win
          path: release/*.exe

  release:
    needs: [build-linux, build-windows] # Add build-macos to this list when I get a macOS developer certificate.
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Deduplicate Windows artifacts
        run: |
          cd artifacts
          # electron-builder portable produces a generic win.exe alongside arch-specific ones
          for f in *-win.exe; do
            [ -f "$f" ] || continue
            base="${f%-win.exe}"
            if ls "${base}-win-x64.exe" 2>/dev/null || ls "${base}-win-arm64.exe" 2>/dev/null; then
              echo "Removing duplicate: $f"
              rm "$f"
            fi
          done
          echo "Final artifacts:"
          ls -la
      - name: Copy User Manual
        run: cp ./User-Manual.pdf artifacts/User-Manual.pdf
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.pdf
