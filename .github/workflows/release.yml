name: App Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '0.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # I do not have a macOS developer certificate, so I cannot sign the macOS app. When I decide to pay $99 a year for one, I will uncomment this job.
