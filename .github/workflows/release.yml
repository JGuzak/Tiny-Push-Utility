name: App Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '0.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # I do not have a macOS developer certificate, so I cannot sign the macOS app. When I decide to pay $99 a year for one, I will uncomment this job.
  # build-macos:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '24'
  #     - name: Install dependencies
  #       run: npm ci
  #     - name: Build
  #       env:
  #         CSC_LINK: ${{ secrets.CSC_LINK }}
  #         CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
  #         APPLE_ID: ${{ secrets.APPLE_ID }}
  #         APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  #         APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  #       run: npx electron-builder --mac --publish never
  #     - name: Upload artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: app-mac
  #         path: release/*.zip

  build-linux:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx electron-builder --linux --publish never
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: release/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx electron-builder --win --publish never
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-win
          path: release/*.exe

  release:
    needs: [build-linux, build-windows] # Add build-macos to this list when I get a macOS developer certificate.
    runs-on: linux
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage Artifacts
        working-directory: artifacts
        run: |
            shopt -s nullglob
            for FILE in *.exe *.AppImage *.zip; do
              EXT="${FILE#*.}"
              BASE="${FILE%%.*}"
              STAGED_NAME="${BASE}-${{ github.ref_name }}.${EXT}"
              echo "Renaming: $FILE -> $STAGED_NAME"
              mv "$FILE" "$STAGED_NAME"
            done
      - name: Stage User Manual
        run: cp ${GITHUB_WORKSPACE}/user-manual.pdf artifacts/User-Manual.pdf
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.pdf
